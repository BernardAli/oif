<script>
window.OIFCharts = (function () {
  var bodyFont = '{{ site_branding.body_font|escapejs }}', titleFont = '{{ site_branding.title_font|escapejs }}';
  var brand = {
    ink: '{{ brand_palette.ink|escapejs }}',
    inkSoft: '{{ brand_palette.ink_soft|escapejs }}',
    paper: '{{ brand_palette.paper|escapejs }}',
    cream: '{{ brand_palette.cream|escapejs }}',
    coffee: '{{ brand_palette.coffee|escapejs }}',
    coffeeDeep: '{{ brand_palette.coffee_deep|escapejs }}',
    coffeeSoft: '{{ brand_palette.coffee_soft|escapejs }}',
    tan: '{{ brand_palette.tan|escapejs }}',
    dark: '{{ brand_palette.dark|escapejs }}',
    line: '{{ brand_palette.line|escapejs }}'
  };
  var palette = [brand.coffee, brand.tan, brand.coffeeSoft, brand.ink,
                 brand.coffeeDeep, brand.inkSoft, brand.cream];
  var axis = brand.inkSoft, line = brand.line, ink = brand.ink;

  function alpha(hex, opacity) {
    var value = hex.replace('#', '');
    if (value.length === 3) value = value.split('').map(function (c) { return c + c; }).join('');
    var number = parseInt(value, 16);
    return 'rgba(' + ((number >> 16) & 255) + ',' + ((number >> 8) & 255) + ',' +
      (number & 255) + ',' + opacity + ')';
  }

  function gradient(from, to) {
    return new echarts.graphic.LinearGradient(0, 0, 0, 1, [
      { offset: 0, color: from },
      { offset: 1, color: to }
    ]);
  }

  function tooltip(trigger) {
    return {
      trigger: trigger || 'axis',
      backgroundColor: alpha(brand.ink, 0.94),
      borderColor: alpha(brand.paper, 0.12),
      borderWidth: 1,
      padding: [10, 12],
      textStyle: { color: brand.cream, fontFamily: bodyFont, fontSize: 12 },
      extraCssText: 'box-shadow:0 16px 40px ' + alpha(brand.ink, 0.18) + ';border-radius:6px;'
    };
  }

  function base(extra) {
    return Object.assign({
      color: palette,
      backgroundColor: 'transparent',
      textStyle: { fontFamily: bodyFont, color: ink },
      animationDuration: 900,
      animationEasing: 'cubicOut',
      grid: { left: 48, right: 22, top: 34, bottom: 48, containLabel: true }
    }, extra || {});
  }

  function xAxis(labels, rotate) {
    return {
      type: 'category',
      data: labels || [],
      boundaryGap: true,
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: {
        color: axis,
        fontFamily: bodyFont,
        fontSize: 11,
        margin: 14,
        interval: 0,
        rotate: rotate || 0
      }
    };
  }

  function yAxis() {
    return {
      type: 'value',
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: { color: axis, fontFamily: bodyFont, fontSize: 11 },
      splitLine: { lineStyle: { color: line, type: 'dashed' } }
    };
  }

  function lineOpt(rows) {
    rows = rows || { labels: [], values: [] };
    return base({
      tooltip: tooltip('axis'),
      xAxis: xAxis(rows.labels),
      yAxis: yAxis(),
      series: [{
        type: 'line',
        smooth: true,
        data: rows.values || [],
        symbol: 'circle',
        symbolSize: 8,
        lineStyle: { width: 4, color: brand.coffee, shadowBlur: 8, shadowColor: alpha(brand.coffee, 0.18) },
        itemStyle: { color: brand.coffee, borderColor: brand.cream, borderWidth: 2 },
        areaStyle: { color: gradient(alpha(brand.coffee, 0.24), alpha(brand.coffee, 0.02)) },
        emphasis: { focus: 'series' }
      }]
    });
  }

  function barOpt(rows) {
    rows = rows || { labels: [], values: [] };
    var rotate = rows.labels && rows.labels.length > 3 ? 15 : 0;
    return base({
      tooltip: tooltip('axis'),
      xAxis: xAxis(rows.labels, rotate),
      yAxis: yAxis(),
      series: [{
        type: 'bar',
        data: rows.values || [],
        barMaxWidth: 42,
        itemStyle: {
          borderRadius: [6, 6, 0, 0],
          color: gradient(brand.coffeeSoft, brand.coffee)
        },
        emphasis: { itemStyle: { color: brand.tan } }
      }]
    });
  }

  function pieOpt(rows) {
    return base({
      tooltip: tooltip('item'),
      legend: {
        bottom: 0,
        left: 'center',
        icon: 'roundRect',
        itemWidth: 10,
        itemHeight: 10,
        textStyle: { color: axis, fontFamily: bodyFont, fontSize: 11 }
      },
      series: [{
        type: 'pie',
        radius: ['52%', '72%'],
        center: ['50%', '43%'],
        data: rows || [],
        avoidLabelOverlap: true,
        itemStyle: { borderColor: brand.cream, borderWidth: 3 },
        label: { color: ink, fontFamily: bodyFont, fontSize: 11, formatter: '{b}\n{d}%' },
        labelLine: { length: 12, length2: 8, lineStyle: { color: line } },
        emphasis: { scale: true, scaleSize: 6 }
      }]
    });
  }

  function stackedOpt(payload) {
    payload = payload || { categories: [], series: [] };
    return base({
      tooltip: tooltip('axis'),
      legend: {
        bottom: 0,
        textStyle: { color: axis, fontFamily: bodyFont, fontSize: 11 }
      },
      xAxis: xAxis(payload.categories),
      yAxis: yAxis(),
      series: (payload.series || []).map(function (s, index) {
        return {
          name: s.name,
          type: 'bar',
          stack: 'total',
          data: s.data || [],
          barMaxWidth: 38,
          itemStyle: {
            borderRadius: index === (payload.series.length - 1) ? [6, 6, 0, 0] : 0
          },
          emphasis: { focus: 'series' }
        };
      })
    });
  }

  function init(el, option) {
    var chart = echarts.init(el, null, { renderer: 'canvas' });
    chart.setOption(option);
    return chart;
  }

  return {
    palette: palette,
    titleFont: titleFont,
    bodyFont: bodyFont,
    line: lineOpt,
    bar: barOpt,
    pie: pieOpt,
    stacked: stackedOpt,
    init: init
  };
})();
</script>
